# CI (plan section 21.2). Every action is pinned to a commit SHA (plan SEC-54); the tag is in the comment.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint .
      - run: pnpm exec prettier --check .
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: node scripts/build-migration.mjs && git diff --exit-code apps/api/migrations/0001_init.sql
      - run: node scripts/check-migration.mjs
      - name: Build the web app
        run: pnpm --filter @c2a/web build
        env:
          API_ORIGIN: http://localhost:4000

  database:
    name: TiDB integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # DBC-09: CI runs TiDB, never MySQL. Pinned to the TiDB Cloud Starter version (docker-compose.yml).
      - name: Start TiDB (single node)
        run: |
          docker run -d --name tidb -p 4100:4000 pingcap/tidb:v8.5.3 --store=unistore --path=/data/tidb --advertise-address=127.0.0.1
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/4100) 2>/dev/null; then break; fi
            sleep 2
          done
          sleep 5
      - name: Run the database suite (migrations, compatibility, queue, auth, accounts, posting)
        run: pnpm --filter @c2a/api test:db
        env:
          TEST_DATABASE_URL: mysql://root@127.0.0.1:4100/
          TEST_DATABASE_TLS: 'false'
          S3_QUEUE_JOBS: '2000'
          S3_QUEUE_WORKERS: '20'
